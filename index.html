<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M1A2 SEPv3 Turntable</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root { --ink: #e9e4d4; --glass: rgba(22, 24, 20, 0.55); --line: rgba(233, 228, 212, 0.18); }

    pointer-events: none; z-index: 10; }
  #dock { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-wrap: wrap;
    gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 10; max-width: calc(100vw - 32px);
    box-sizing: border-box; justify-content: center; font-size: 12px; }

</head>
<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* =====================================================================
   core: renderer, scene, camera, controls, geometry helpers
   Units: metres. Tank forward = +Z, up = +Y, tank's right = -X.
   ===================================================================== */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;      // PCF path is patched with PCSS below

/* ---------------------------------------------------------------------
   post (part 1): PCSS patched into the shadow chunk, enabled per light.
   A light whose shadow.radius >= 10 uses contact-hardening PCSS with
   penumbra = (zReceiver - zBlocker) * radius * 0.001 (in shadow-map UV).
   Any other light keeps three's stock 17-tap PCF.
   --------------------------------------------------------------------- */
const PCSS = { enabled: true };
(() => {
  const chunk = THREE.ShaderChunk.shadowmap_pars_fragment;
  const pcss = /* glsl */`
	#define PCSS_SAMPLES 20
	vec2 pcssDisk[ PCSS_SAMPLES ];
	void pcssInit( vec2 seed ) {
		float ang = rand( seed ) * PI2;
		for ( int i = 0; i < PCSS_SAMPLES; i ++ ) {
			float fi = float( i ) + 0.5;
			pcssDisk[ i ] = vec2( cos( ang ), sin( ang ) ) * sqrt( fi / float( PCSS_SAMPLES ) );
			ang += 2.39996323;
		}
	}
	float pcssShadow( sampler2D sm, vec2 size, float k, vec4 c ) {
		pcssInit( gl_FragCoord.xy * 0.0131 + c.xy );
		float searchR = clamp( k * 0.06, 1.5 / size.x, 0.015 );
		float sum = 0.0, n = 0.0;
		for ( int i = 0; i < PCSS_SAMPLES; i ++ ) {
			float d = unpackRGBAToDepth( texture2D( sm, c.xy + pcssDisk[ i ] * searchR ) );
			if ( d < c.z ) { sum += d; n += 1.0; }
		}
		if ( n < 0.5 ) return 1.0;
		float pen = clamp( ( c.z - sum / n ) * k, 1.0 / size.x, 0.03 );
		float lit = 0.0;
		for ( int i = 0; i < PCSS_SAMPLES; i ++ ) lit += texture2DCompare( sm, c.xy + pcssDisk[ i ] * pen, c.z );
		return lit / float( PCSS_SAMPLES );
	}
	float getShadow(`;
  const i0 = chunk.indexOf('float getShadow(');
  let head = chunk.slice(0, i0), body = chunk.slice(i0 + 'float getShadow('.length);
  const pcfOpen = '#if defined( SHADOWMAP_TYPE_PCF )';
  const j = body.indexOf(pcfOpen);
  body = body.slice(0, j + pcfOpen.length) + '\n\t\t\tif ( shadowRadius >= 10.0 ) { shadow = pcssShadow( shadowMap, shadowMapSize, shadowRadius * 0.001, shadowCoord ); } else {' + body.slice(j + pcfOpen.length);
  const softOpen = '#elif defined( SHADOWMAP_TYPE_PCF_SOFT )';
  const k = body.indexOf(softOpen);
  body = body.slice(0, k) + '}\n\t\t' + body.slice(k);
  THREE.ShaderChunk.shadowmap_pars_fragment = head + pcss + body;
})();
/** Shadow radius that turns PCSS on for a directional light (light angular radius tan = tanA). */
const pcssRadiusDir = (light, tanA) => { const c = light.shadow.camera; return 1000 * (c.far - c.near) * tanA / (c.right - c.left); };

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd2bb98, 140, 1350);     // colour set from the sky horizon in desert()

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(10.5, 3.6, 11.5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.25, 0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5;
controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

const clock = new THREE.Clock();
const updaters = [];            // per-frame callbacks: fn(dt, t)
const onFrame = (fn) => updaters.push(fn);

// --- geometry helpers ------------------------------------------------
const D2R = Math.PI / 180;
/** Seeded PRNG so procedural detail is identical on every load. */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20231124);
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
/** Matrix from position [x,y,z], euler [rx,ry,rz] (radians), scale (number|[x,y,z]). */
function T(pos = [0, 0, 0], rot = [0, 0, 0], scl = 1) {
  _p.set(pos[0], pos[1], pos[2]);
  _q.setFromEuler(_e.set(rot[0], rot[1], rot[2], rot[3] || 'XYZ'));
  if (typeof scl === 'number') _s.set(scl, scl, scl); else _s.set(scl[0], scl[1], scl[2]);
  return new THREE.Matrix4().compose(_p, _q, _s);
}
/** Normalise a geometry so it can be merged: non-indexed, position/normal/uv only, no groups. */
function prep(geo) {
  let g = geo.index ? geo.toNonIndexed() : geo;
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  g.clearGroups();
  g.morphAttributes = {};
  return g;
}
const G = {
  box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
  rbox: (w, h, d, r = 0.01, seg = 2) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4)),
  cyl: (rt, rb, h, seg = 24, open = false) => new THREE.CylinderGeometry(rt, rb, h, seg, 1, open),
  cylX: (r, h, seg = 24, rb) => new THREE.CylinderGeometry(r, rb ?? r, h, seg).rotateZ(Math.PI / 2),
  cylZ: (r, h, seg = 24, rb) => new THREE.CylinderGeometry(r, rb ?? r, h, seg).rotateX(Math.PI / 2),
  torus: (R, r, rs = 8, ts = 24, arc = Math.PI * 2) => new THREE.TorusGeometry(R, r, rs, ts, arc),
  sphere: (r, ws = 16, hs = 12) => new THREE.SphereGeometry(r, ws, hs),
  /** Tube through 3D points [[x,y,z],...]. */
  tube: (pts, r, seg = 32, rs = 8, closed = false, tension = 0.5) => new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), closed, 'catmullrom', tension), seg, r, rs, closed),
  /** Polyline tube with sharp-ish bends (for handles, guards, rails). */
  rail: (pts, r, rs = 8) => {
    const path = new THREE.CurvePath();
    for (let i = 0; i < pts.length - 1; i++) path.add(new THREE.LineCurve3(new THREE.Vector3(...pts[i]), new THREE.Vector3(...pts[i + 1])));
    return new THREE.TubeGeometry(path, Math.max(2, (pts.length - 1) * 6), r, rs, false);
  },
  /** Side profile [[z,y],...] extruded across X (centred), with a bevel. */
  extrudeX: (profile, halfW, bevel = 0.03, bevelSeg = 2) => {
    const s = new THREE.Shape(profile.map(([z, y]) => new THREE.Vector2(z, y)));
    const depth = Math.max(0.001, 2 * halfW - 2 * bevel);
    const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: bevelSeg, curveSegments: 4 });
    g.translate(0, 0, -depth / 2);
    g.rotateY(-Math.PI / 2);  // shape x -> world +z, extrusion -> world x
    return g;
  },
  /** Plan/elevation shape [[a,b],...] extruded along its normal by depth. */
  extrude: (pts, depth, bevel = 0, bevelSeg = 1, holes = []) => {
    const s = new THREE.Shape(pts.map(([a, b]) => new THREE.Vector2(a, b)));
    for (const h of holes) s.holes.push(new THREE.Path(h.map(([a, b]) => new THREE.Vector2(a, b))));
    return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: bevelSeg, curveSegments: 12 });
  },
  lathe: (pts, seg = 32) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg),
  hexBolt: (r = 0.012, h = 0.01) => {
    const head = new THREE.CylinderGeometry(r, r, h, 6).translate(0, h / 2 + h * 0.25, 0);
    const washer = new THREE.CylinderGeometry(r * 1.35, r * 1.35, h * 0.25, 12).translate(0, h * 0.125, 0);
    return mergeGeometries([prep(head), prep(washer)]);
  },
};
/** Loft closed rings of Vector3 (equal counts) into a faceted solid with end caps. */
function loft(rings, capStart = true, capEnd = true) {
  const pos = [];
  const push = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  const n = rings[0].length;
  for (let r = 0; r < rings.length - 1; r++) {
    const A = rings[r], B = rings[r + 1];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      push(A[i], B[i], B[j]); push(A[i], B[j], A[j]);
    }
  }
  const cap = (R, flip) => {
    const c = R.reduce((s, v) => s.add(v), new THREE.Vector3()).multiplyScalar(1 / R.length);
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; flip ? push(c, R[j], R[i]) : push(c, R[i], R[j]); }
  };
  if (capStart) cap(rings[0], false);
  if (capEnd) cap(rings[rings.length - 1], true);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
/** Collects geometry per material, merges into one mesh per material. */
class Kit {
  constructor() { this.lists = new Map(); }
  add(mat, geo, m) {
    const g = prep(geo.clone());
    if (m) g.applyMatrix4(m);
    // per-part random value: lets the weathering shader shade panels individually
    g.setAttribute('aPart', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count).fill(rand()), 1));
    if (!this.lists.has(mat)) this.lists.set(mat, []);
    this.lists.get(mat).push(g);
    return this;
  }
  geometries() {
    const out = new Map();
    for (const [mat, list] of this.lists) out.set(mat, mergeGeometries(list));
    return out;
  }
  build(name = 'kit', shadows = true) {
    const grp = new THREE.Group(); grp.name = name;
    for (const [mat, geo] of this.geometries()) {
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = shadows; m.receiveShadow = true;
      grp.add(m);
    }
    return grp;
  }
}

/* =====================================================================
   materials
   ===================================================================== */
const std = (color, roughness, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const MAT = {
  paint:     std(0x4d5236, 0.66, 0.0, { name: 'paint' }),       // CARC Green 383
  steel:     std(0x6b6a64, 0.42, 0.85, { name: 'steel' }),
  darkSteel: std(0x262624, 0.55, 0.6, { name: 'darkSteel' }),
  black:     std(0x0c0c0b, 0.75, 0.0, { name: 'black' }),
  rubber:    std(0x141413, 0.92, 0.0, { name: 'rubber' }),
  glass:     std(0x0b1619, 0.06, 0.2, { name: 'glass' }),
  headlamp:  std(0xd8d4c8, 0.12, 0.1, { name: 'headlamp', emissive: 0x000000 }),
  lensRed:   std(0x7a0d08, 0.2, 0.0, { name: 'lensRed', emissive: 0x2a0302 }),
  lensAmber: std(0xa8650f, 0.2, 0.0, { name: 'lensAmber', emissive: 0x000000 }),
  canvas:    std(0x5b5a3e, 0.95, 0.0, { name: 'canvas' }),           // mantlet cover, bedroll
  canvasTan: std(0x8a7a56, 0.95, 0.0, { name: 'canvasTan' }),
  strap:     std(0x383a29, 0.85, 0.0, { name: 'strap' }),
  cardboard: std(0x9a8461, 0.9, 0.0, { name: 'cardboard' }),
  cooler:    std(0xbfb49a, 0.5, 0.0, { name: 'cooler' }),
  waterCan:  std(0x9c8a5f, 0.55, 0.0, { name: 'waterCan' }),
  camNet:    std(0x585b3a, 1.0, 0.0, { name: 'camNet' }),
  radome:    std(0x3a3d2e, 0.55, 0.0, { name: 'radome' }),
  // running gear variants (get mud)
  rgPaint:   std(0x4d5236, 0.66, 0.0, { name: 'rgPaint' }),
  rgRubber:  std(0x141413, 0.92, 0.0, { name: 'rgRubber' }),
  rgSteel:   std(0x5f5e59, 0.55, 0.55, { name: 'rgSteel' }),
  rgDark:    std(0x262624, 0.55, 0.6, { name: 'rgDark' }),
  trackSteel: std(0x4a4945, 0.6, 0.5, { name: 'trackSteel' }),
  trackRubber: std(0x161615, 0.9, 0.0, { name: 'trackRubber' }),
};
// wire mesh for the bustle rack: one grid cell per UV unit, alpha-tested
MAT.mesh = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 9); g.fillRect(0, 0, 9, 64);
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return std(0x4d5236, 0.6, 0.2, { name: 'mesh', alphaMap: tex, alphaTest: 0.5, side: THREE.DoubleSide });
})();


/* ---------------------------------------------------------------------
   materials: weathering
   One shader injection for every MeshStandardMaterial (onBeforeCompile).
   Noise is sampled in object space (stable on moving parts); masks that
   need "up" or "height" use tank space (uTankInv * modelMatrix).
   --------------------------------------------------------------------- */
/** Tileable 3D noise, 4 channels of periodic Perlin fBm, histogram-equalised to 0..1. */
function makeNoise3D(N = 64) {
  const perm = new Uint8Array(512), pp = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [pp[i], pp[j]] = [pp[j], pp[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = pp[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y, z) => { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  function perlin(x, y, z, P) {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    const xf = x - X, yf = y - Y, zf = z - Z, u = fade(xf), v = fade(yf), w = fade(zf);
    const x0 = X % P, y0 = Y % P, z0 = Z % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P, z1 = (z0 + 1) % P;
    const h = (a, b, c) => perm[perm[perm[a] + b] + c] & 15;
    const l = (a, b, t) => a + (b - a) * t;
    return l(
      l(l(grad(h(x0, y0, z0), xf, yf, zf), grad(h(x1, y0, z0), xf - 1, yf, zf), u), l(grad(h(x0, y1, z0), xf, yf - 1, zf), grad(h(x1, y1, z0), xf - 1, yf - 1, zf), u), v),
      l(l(grad(h(x0, y0, z1), xf, yf, zf - 1), grad(h(x1, y0, z1), xf - 1, yf, zf - 1), u), l(grad(h(x0, y1, z1), xf, yf - 1, zf - 1), grad(h(x1, y1, z1), xf - 1, yf - 1, zf - 1), u), v), w);
  }
  // channel: [periods, weights, ridged]
  const spec = [[[2, 4, 8], [1, 0.5, 0.25], false], [[4, 8, 16], [1, 0.5, 0.25], false], [[16, 32], [1, 0.5], false], [[8, 16], [1, 0.5], true]];
  const n3 = N * N * N, out = new Uint8Array(n3 * 4), tmp = new Float32Array(n3);
  spec.forEach(([periods, weights, ridged], c) => {
    let i = 0, mn = 1e9, mx = -1e9;
    for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++, i++) {
      let v = 0;
      for (let o = 0; o < periods.length; o++) {
        const P = periods[o], f = P / N, n = perlin(x * f, y * f, z * f, P);
        v += (ridged ? 1 - Math.abs(n) * 1.6 : n) * weights[o];
      }
      tmp[i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
    }
    const B = 4096, hist = new Uint32Array(B), bin = (v) => Math.min(B - 1, Math.floor((v - mn) / (mx - mn) * B));
    for (let k = 0; k < n3; k++) hist[bin(tmp[k])]++;
    const cdf = new Float32Array(B); let acc = 0;
    for (let b = 0; b < B; b++) { acc += hist[b]; cdf[b] = acc / n3; }
    for (let k = 0; k < n3; k++) out[k * 4 + c] = Math.round(cdf[bin(tmp[k])] * 255);
  });
  const tex = new THREE.Data3DTexture(out, N, N, N);
  tex.format = THREE.RGBAFormat; tex.type = THREE.UnsignedByteType;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = tex.wrapR = THREE.RepeatWrapping;
  tex.unpackAlignment = 1; tex.needsUpdate = true;
  return tex;
}
/** Canvas-generated detail maps packed in RGB: R chips/scratches, G rain streaks, B grain/dents. */
function makeDetailTexture(S = 512) {
  const layer = (bg, draw) => {
    const c = document.createElement('canvas'); c.width = c.height = S;

let trackDustColor = () => {};

  const N = 260, pos = new Float32Array(N * 3), size = new Float32Array(N), alpha = new Float32Array(N);

/** Canvas mantlet cover: folded frustum from turret face to thermal sleeve. */
function mantletCoverGeo() {
  const U = 56, V = 16, pos = [], idx = [], uvs = [];
  const z0 = 0.26, z1 = 0.72;
  for (let j = 0; j <= V; j++) {
    const v = j / V, z = z0 + (z1 - z0) * v;
    for (let i = 0; i <= U; i++) {
      const u = i / U, a = u * Math.PI * 2;
      const rx = THREE.MathUtils.lerp(0.44, 0.135, Math.pow(v, 0.8)), ry = THREE.MathUtils.lerp(0.3, 0.135, Math.pow(v, 0.8));
      let k = 1 + 0.06 * Math.sin(a * 9 + v * 2.5) * (1 - v) * (0.6 + 0.4 * Math.sin(a * 2)) + 0.025 * Math.sin(v * Math.PI * 6 + a) * (1 - v * 0.5);
      if (v > 0.92) k = 1 + (k - 1) * (1 - (v - 0.92) / 0.08);
      let y = Math.sin(a) * ry * k; const x = Math.cos(a) * rx * k;
      if (y < 0) y *= 1 + 0.12 * (1 - v);              // slight sag underneath
      pos.push(x, y, z); uvs.push(u * 4, v * 2);
    }
  }
  for (let j = 0; j < V; j++) for (let i = 0; i < U; i++) {
    const a = j * (U + 1) + i, b = a + U + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function buildGun() {
  const pivot = new THREE.Group(); pivot.name = 'gun';
  pivot.position.set(...TUR.trunnion);
  const k = new Kit();
  // thermal sleeve segments (paint), radii taper toward the muzzle
  const segs = [[0.40, 1.15, 0.118], [1.17, 2.05, 0.114], [2.65, 3.45, 0.108], [3.47, 4.18, 0.104]];
  for (const [a, b, r] of segs) {
    k.add(MAT.paint, G.cylZ(r, b - a, 28, r + 0.002), T([0, 0, (a + b) / 2]));
    k.add(MAT.paint, G.box(0.02, 0.008, b - a - 0.04), T([0, r + 0.002, (a + b) / 2]));                  // seam
    for (const f of [0.25, 0.75]) {                                                                          // straps + buckles
      const z = a + (b - a) * f;
      k.add(MAT.strap, G.cylZ(r + 0.006, 0.03, 28), T([0, 0, z]));
      k.add(MAT.steel, G.rbox(0.03, 0.02, 0.04, 0.005), T([r * 0.72, r * 0.72, z], [0, 0, -Math.PI / 4]));
    }
    for (const ang of [0.6, Math.PI - 0.6, -Math.PI / 2]) {                                                // latches at the joint
      k.add(MAT.darkSteel, G.rbox(0.03, 0.018, 0.06, 0.006), T([Math.cos(ang) * (r + 0.008), Math.sin(ang) * (r + 0.008), b - 0.02], [0, 0, ang - Math.PI / 2]));
    }
  }
  // bore evacuator
  k.add(MAT.paint, G.lathe([[0.114, 0], [0.13, 0.04], [0.158, 0.12], [0.162, 0.2], [0.162, 0.42], [0.155, 0.5], [0.13, 0.57], [0.108, 0.6]], 36).rotateX(Math.PI / 2), T([0, 0, 2.05]));
  k.add(MAT.strap, G.cylZ(0.165, 0.025, 36), T([0, 0, 2.3]));
  // muzzle with bore
  k.add(MAT.steel, G.lathe([[0.102, 0], [0.1, 0.1], [0.098, 0.12], [0.062, 0.12], [0.062, 0.08]], 36).rotateX(Math.PI / 2), T([0, 0, 4.18]));
  k.add(MAT.black, G.cylZ(0.062, 0.06, 24), T([0, 0, 4.25]));
  // muzzle reference sensor: clamp ring, bracket, emitter box looking back
  k.add(MAT.darkSteel, G.cylZ(0.114, 0.05, 28), T([0, 0, 4.12]));
  k.add(MAT.darkSteel, G.rbox(0.05, 0.06, 0.05, 0.008), T([0, 0.14, 4.12]));
  k.add(MAT.darkSteel, G.rbox(0.09, 0.06, 0.11, 0.012), T([0, 0.19, 4.11]));
  k.add(MAT.glass, G.cylZ(0.016, 0.01, 14), T([0, 0.19, 4.05]));
  // breech-end collar under the cover + canvas cover + cover straps
  k.add(MAT.darkSteel, G.cylZ(0.2, 0.3, 32), T([0, 0, 0.12]));
  const cover = mantletCoverGeo();
  k.add(MAT.canvas, cover);
  for (const [v, r] of [[0.62, 0.2], [0.88, 0.148]]) k.add(MAT.strap, G.torus(r, 0.012, 6, 36).scale(1.12, 1, 1), T([0, 0, 0.26 + 0.46 * v]));
  k.add(MAT.strap, G.tube([[0, 0.31, 0.27], [0, 0.26, 0.42], [0, 0.2, 0.56], [0, 0.15, 0.68]], 0.01, 16, 4));
  pivot.add(k.build('gunTube'));
  PARTS.gun = pivot;
  return pivot;
}

function ribbedRadar(k, m, w, h) {
  k.add(MAT.paint, G.rbox(w + 0.04, h + 0.04, 0.035, 0.01), m);
  k.add(MAT.radome, G.rbox(w, h, 0.02, 0.006), mul(m, T([0, 0, 0.012])));
  const n = Math.round(w / 0.034);
  for (let i = 0; i < n; i++) k.add(MAT.paint, G.box(0.01, h - 0.02, 0.014), mul(m, T([-w / 2 + (i + 0.5) * w / n, 0, 0.024])));
  k.add(MAT.paint, G.rbox(w + 0.06, 0.03, 0.06, 0.008), mul(m, T([0, h / 2 + 0.03, 0.02])));   // rain lip
  for (const [x, y] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) k.add(MAT.paint, G.hexBolt(0.008, 0.006), mul(m, T([x * (w / 2 + 0.008), y * (h / 2 + 0.008), 0.018], [Math.PI / 2, 0, 0])));
}

function buildAPS() {
  const root = new THREE.Group(); root.name = 'aps';

function buildDecals() {
  // hull: bumper codes front (glacis) and rear, NO STEP on deck doors
  const hk = new Kit(), ca = Math.cos(GL_ANG), sa = Math.sin(GL_ANG);
  for (const [x, key] of [[0.86, 'bumpL'], [-0.86, 'bumpR']]) {
    const z = 3.78, y = hullTopY(z);
    hk.add(MAT.decal, decalGeo(key, 0.075, [x, y, z], [1, 0, 0], [0, sa, -ca]));
    hk.add(MAT.decal, decalGeo(key, 0.07, [-x * 1.18, 1.18, -3.96], [-1, 0, 0], [0, 1, 0]));
  }
  for (const sx of [1, -1]) hk.add(MAT.decal, decalGeo('nostep', 0.06, [sx * 0.42, hullTopY(-2.05) + 0.026, -2.05], [-1, 0, 0], [0, 0, 1]));
  hull.add(hk.build('hullDecals', false));
  // turret: vehicle number on side boxes, LIFT marks, NO STEP on APS tops
  const tk = new Kit(), R = TUR.roof;
  tk.add(MAT.decal, decalGeo('num', 0.2, [1.9, 0.63, -1.15], [0, 0, -1], [0, 1, 0]));
  tk.add(MAT.decal, decalGeo('num', 0.2, [-1.9, 0.63, -1.15], [0, 0, 1], [0, 1, 0]));
  for (const [x, z] of [[1.3, 0.5], [-1.3, 0.5], [1.22, -2.4], [-1.22, -2.4]]) {
    const sx = Math.sign(x);
    tk.add(MAT.decal, decalGeo('lift', 0.07, [x - sx * 0.34, R, z], [0, 0, -sx], [-sx, 0, 0]));

// seamless 360 cyclorama: floor -> cove -> wall, vertex-colour falloff
function buildCyclorama() {
  const prof = [[0, 0], [4, 0], [8, 0], [13, 0], [18, 0], [23, 0], [27, 0], [30, 0]];
  for (let i = 1; i <= 12; i++) { const t = i / 12 * Math.PI / 2; prof.push([30 + 8 * Math.sin(t), 8 - 8 * Math.cos(t)]); }
  prof.push([38, 14], [38, 22], [38, 32]);
  const g = new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 160);
  const p = g.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const r = Math.hypot(p.getX(i), p.getZ(i)), y = p.getY(i);
    const b = y < 0.01 ? 1 - 0.32 * sstep(4, 30, r) : 0.68 - 0.4 * sstep(0, 30, y);
    col.set([b, b, b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, color: 0xd8d8d4, roughness: 0.92, side: THREE.DoubleSide, name: 'cyclorama' }));
  m.receiveShadow = true; m.name = 'cyclorama'; m.visible = false;
  return m;
}
const cyc = buildCyclorama(); cyc.material.envMapIntensity = 0.4; scene.add(cyc);

/** Studio reflection map: soft boxes, strip lights and an overhead ring. */
function buildStudioEnv(noir = false) {
  const env = new THREE.Scene();
  const emi = (c, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide });
  env.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(noir ? 0x050506 : 0x2a2a2c).multiplyScalar(noir ? 0.4 : 0.6), side: THREE.BackSide })));
  const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(noir ? 0x0a0a0b : 0x8e8e8a).multiplyScalar(noir ? 0.3 : 0.55) }));
  floor.position.y = -1.6; env.add(floor);
  const panel = (w, h, pos, mat) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(...pos); m.lookAt(0, 1.2, 0); env.add(m); };
  if (!noir) {
    panel(9, 6, [12, 9, 11], emi(0xfff3e4, 7));          // key soft box
    panel(7, 4.5, [-13, 5, 8], emi(0xdbe6ff, 2.2));      // fill soft box
    panel(1.2, 11, [-10, 6, -12], emi(0xffffff, 9));     // strip lights (rim)
    panel(1.2, 11, [11, 6, -11], emi(0xffffff, 6));
    const ring = new THREE.Mesh(new THREE.TorusGeometry(7, 0.35, 12, 64).rotateX(Math.PI / 2), emi(0xffffff, 5)); ring.position.y = 13; env.add(ring);
  } else {
    panel(4, 3, [9, 10, 9], emi(0xffb070, 3.5));         // warm key
    panel(1.0, 10, [-9, 5, -11], emi(0x4f7dff, 6));      // blue rim strip
  }
  const t = pmrem.fromScene(env, 0.0, 0.1, 200).texture;
  env.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  return t;
}

const POST = {};
// computed contact shade: SDF of the hull footprint + tight dark track contact strips
const contactShade = (() => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(7, 11).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    uniforms: { uStrength: { value: 1.0 } }, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
    vertexShader: `varying vec2 vP; void main(){ vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uStrength; varying vec2 vP;
      float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
      void main() {
        float hullD = sdBox(vP - vec2(0.0, 0.0), vec2(1.55, 3.6));
        float trk = min(sdBox(vP - vec2(1.455, -0.05), vec2(0.28, 2.45)), sdBox(vP + vec2(1.455, 0.05), vec2(0.28, 2.45)));
        float a = (1.0 - smoothstep(-0.9, 1.3, hullD)) * 0.42 + (1.0 - smoothstep(-0.05, 0.4, trk)) * 0.4;
        gl_FragColor = vec4(0.0, 0.0, 0.0, clamp(a, 0.0, 0.85) * uStrength);
      }`,
  }));

})();
// GTAO normal pass that honours terrain displacement
const aoNormalMat = new THREE.ShaderMaterial({
  uniforms: { uTerrain: { value: 0 }, uScroll: SAND.uScroll }, blending: THREE.NoBlending,
  vertexShader: `#include <common>
    ${NOISE_GLSL}
    ${TERRAIN_GLSL}
    uniform float uTerrain; varying vec3 vN;
    void main() {
      #include <beginnormal_vertex>

      if (uTerrain > 0.5) {
        float tH = terrainH(position.xz), tHx = terrainH(position.xz + vec2(0.5, 0.0)), tHz = terrainH(position.xz + vec2(0.0, 0.5));
        objectNormal = normalize(vec3(tH - tHx, 0.5, tH - tHz)); transformed = vec3(position.x, tH, position.z);

  fragmentShader: `#include <packing>

const FinalShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 0.32 }, uGrain: { value: 0.03 }, uThermal: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime, uVig, uGrain, uThermal; uniform vec2 uRes; varying vec2 vUv;
    float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      if (uThermal > 0.5) {
        vec2 px = 1.0 / uRes;
        float b = (texture2D(tDiffuse, vUv + vec2(px.x, 0.0)).r + texture2D(tDiffuse, vUv - vec2(px.x, 0.0)).r +
                   texture2D(tDiffuse, vUv + vec2(0.0, px.y)).r + texture2D(tDiffuse, vUv - vec2(0.0, px.y)).r) * 0.25;

        h += (h12(vec2(floor(vUv.x * uRes.x), 3.0)) - 0.5) * 0.025;                       // column fixed pattern

const THERM = { on: false, saved: new Map(), cache: new Map(), uMove: { value: 0 }, uBarrel: { value: 0 } };

  #include <common>

    #include <begin_vertex>
    #include <project_vertex>

    #endif

    vTP = (toT * tp).xyz; vTN = normalize(mat3(toT) * tn); vVN = normalize(transformedNormal); vObj = transformed; vDist = -mvPosition.z;

    #endif

  uniform float uBase, uMove, uBarrel, uFric; uniform sampler2D uAlphaTex;

  void main() {

      if (texture2D(uAlphaTex, vUv2).g < 0.5) discard;
    #elif ALPHA == 2
      if (texture2D(uAlphaTex, vUv2).a < 0.5) discard;
    #endif

      h += 0.42 * (1.0 - smoothstep(0.4, 2.4, length((vTP - vec3(0.0, 1.15, -3.3)) * vec3(0.75, 1.0, 0.9))));   // engine bay
      h += 0.5 * (1.0 - smoothstep(0.1, 0.95, length((vTP - vec3(0.0, 1.07, -4.0)) * vec3(0.6, 1.2, 1.0))));     // exhaust
      h += 0.06 * smoothstep(0.4, 0.95, vTN.y);                                                                   // sun-soaked tops
    #endif

    #if BARREL
      h += uBarrel * 0.6 * smoothstep(0.3, 1.5, vObj.z);
    #endif

  }`;

  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main() { vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `varying vec3 vDir; void main() { float h = normalize(vDir).y; gl_FragColor = vec4(vec3(mix(0.2, 0.04, pow(clamp(h, 0.0, 1.0), 0.45))), 1.0); }`,
});
const heatGround = new THREE.ShaderMaterial({
  uniforms: { uScroll: SAND.uScroll, uSun: { value: SUN_DIR } },
  vertexShader: `${NOISE_GLSL}\n${TERRAIN_GLSL}
    varying vec3 vW; varying vec3 vN; varying vec2 vL; varying float vD;
    void main() { vec2 l = position.xz; float h = terrainH(l), hx = terrainH(l + vec2(0.5, 0.0)), hz = terrainH(l + vec2(0.0, 0.5));
      vN = normalize(vec3(h - hx, 0.5, h - hz)); vW = vec3(l.x, h, l.y + uScroll); vL = l;
      vec4 mv = modelViewMatrix * vec4(l.x, h, l.y, 1.0); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `${NOISE_GLSL}
    uniform vec3 uSun; varying vec3 vW; varying vec3 vN; varying vec2 vL; varying float vD;
    void main() {
      vec2 pw = vW.xz;
      float h = 0.25 + 0.18 * max(dot(vN, uSun), 0.0) + 0.09 * (fbm2(pw * 0.05) - 0.5) + 0.05 * (fbm2(pw * 0.6) - 0.5);
      h += 0.018 * sin(dot(pw, vec2(0.94, 0.34)) * 41.0 + fbm2(pw * 0.35) * 14.0) * (1.0 - smoothstep(8.0, 40.0, vD));
      float band = (1.0 - smoothstep(0.27, 0.34, abs(abs(vL.x) - 1.455))) * smoothstep(-3.2, -3.7, vL.y) * (1.0 - smoothstep(10.0, 60.0, -vL.y));
      h += band * 0.06;
      h = mix(h, 0.2, smoothstep(60.0, 1300.0, vD));
      gl_FragColor = vec4(vec3(h), 1.0);
    }`,
});
const TANK_HEAT = { paint: 0.42, mesh: 0.4, steel: 0.4, darkSteel: 0.41, black: 0.42, rubber: 0.44, glass: 0.2, headlamp: 0.25, lensRed: 0.3, lensAmber: 0.25,
  canvas: 0.38, canvasTan: 0.38, strap: 0.38, cardboard: 0.36, cooler: 0.3, waterCan: 0.32, camNet: 0.37, radome: 0.46, decal: 0.4,
  rgPaint: 0.46, rgRubber: 0.47, rgSteel: 0.47, rgDark: 0.47, trackSteel: 0.46, trackRubber: 0.47 };
const SCENE_HEAT = { mesa: 0.3, rock: 0.4, twig: 0.3, leaf: 0.26, concrete: 0.38, geotextile: 0.36, wire: 0.4, sandbag: 0.36, drumOlive: 0.44, drumBlue: 0.44, drumRust: 0.46, black: 0.42, cyclorama: 0.28 };
function isUnder(o, root) { for (let p = o; p; p = p.parent) if (p === root) return true; return false; }
function setThermal(on) {
  if (on === THERM.on) return;
  THERM.on = on;
  if (on) {
    scene.traverse(o => {
      if (o.isPoints || o === contactShade || o.name === 'beam') { THERM.saved.set(o, { visible: o.visible }); o.visible = false; return; }
      if (!o.isMesh) return;
      const m = o.material; let hm;
      if (o === ground) hm = heatGround;
      else if (o === sky) hm = heatSky;
      else if (isUnder(o, tank)) {
        const n = m.name, nightLamp = LIGHTING.preset === 'night' && n === 'headlamp';
        const fric = /^(rg|track)/.test(n) ? 1 : 0;
        hm = heatMat(nightLamp ? 0.9 : (TANK_HEAT[n] ?? 0.4), { tank: true, fric, barrel: isUnder(o, PARTS.gun),
          alpha: m.alphaMap ? 1 : (m.map && m.alphaTest > 0 ? 2 : 0), alphaTex: m.alphaMap || (m.alphaTest > 0 ? m.map : null), side: m.side });
      } else hm = heatMat(SCENE_HEAT[m.name] ?? 0.35, { alpha: m.alphaMap ? 1 : 0, alphaTex: m.alphaMap, side: m.side });
      THERM.saved.set(o, { material: m }); o.material = hm;
    });
    POST.gtao.enabled = false; renderer.toneMapping = THREE.NoToneMapping;
    POST.final.uniforms.uThermal.value = 1; POST.final.uniforms.uGrain.value = 0.02;
  } else {
    for (const [o, st] of THERM.saved) { if ('material' in st) o.material = st.material; if ('visible' in st) o.visible = st.visible; }
    THERM.saved.clear();
    POST.gtao.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping;
    POST.final.uniforms.uThermal.value = 0; POST.final.uniforms.uGrain.value = 0.03;
  }
}
onFrame((dt) => {
  THERM.uMove.value += ((Math.min(1, Math.abs(RG.speed || 0) / 8)) - THERM.uMove.value) * Math.min(1, dt * 0.3);
  THERM.uBarrel.value *= Math.exp(-dt / 40);
});

// --- gunner's sight camera (narrow FOV, follows turret + gun elevation) ---
const sightCam = new THREE.PerspectiveCamera(9, window.innerWidth / window.innerHeight, 0.5, 4000);
sightCam.position.set(-0.95, TUR.roof + 0.19, 1.36);
PARTS.turret.add(sightCam);
const SIGHT = { on: false };
function setSight(on) {
  SIGHT.on = on;
  POST.setCamera(on ? sightCam : camera);
  controls.enabled = !on;
  document.getElementById('reticle').style.display = on ? 'block' : 'none';
}
const _rd = new THREE.Vector3(), _ro = new THREE.Vector3();
let sightTick = 0;
onFrame(() => {
  sightCam.rotation.set(-PARTS.gun.rotation.x, Math.PI, 0, 'YXZ');
  if (!SIGHT.on || (sightTick++ % 8)) return;
  // azimuth from turret yaw; laser range by marching the sight ray against the terrain height function
  const az = ((-PARTS.turret.rotation.y * 180 / Math.PI) % 360 + 360) % 360;
  document.getElementById('retAz').textContent = 'AZ ' + String(Math.round(az)).padStart(3, '0');
  sightCam.getWorldPosition(_ro); sightCam.getWorldDirection(_rd);
  let d = 0, hit = 0;
  for (let i = 0; i < 160 && !hit; i++) { d += 2 + d * 0.03; const y = _ro.y + _rd.y * d; if (y < terrainH(_ro.x + _rd.x * d, _ro.z + _rd.z * d)) hit = d; }
  document.getElementById('retRange').textContent = 'RNG ' + (hit ? String(Math.round(hit / 5) * 5).padStart(4, '0') : '----');
});

applyPreset('desert');

/* =====================================================================
   ui (minimal for now)
   ===================================================================== */
document.getElementById('optSpin').addEventListener('change', e => { controls.autoRotate = e.target.checked; });
document.getElementById('optAPS').addEventListener('change', e => { PARTS.aps.visible = e.target.checked; });
document.getElementById('optFinish').addEventListener('change', e => { W.uScheme.value = +e.target.value; });
document.getElementById('optDust').addEventListener('input', e => { W.uDust.value = +e.target.value; });
document.getElementById('optWear').addEventListener('input', e => { W.uWear.value = +e.target.value; });
document.getElementById('optLight').addEventListener('change', e => { const th = THERM.on; if (th) setThermal(false); applyPreset(e.target.value); if (th) setThermal(true); });
document.getElementById('optThermal').addEventListener('change', e => {
  setThermal(e.target.checked);
  if (e.target.checked && !SIGHT.on) { document.getElementById('optSight').checked = true; setSight(true); }
});
document.getElementById('optSight').addEventListener('change', e => setSight(e.target.checked));

/* =====================================================================
   perf: FPS readout, resize
   ===================================================================== */
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsT0 = performance.now();
onFrame(() => {
  fpsFrames++; const now = performance.now(), el = (now - fpsT0) / 1000;
  if (el >= 0.5) { fpsEl.textContent = `${(fpsFrames / el).toFixed(el > 2 ? 1 : 0)} fps`; fpsFrames = 0; fpsT0 = now; }
});
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  sightCam.aspect = w / h; sightCam.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  POST.resize(w, h);
}
window.addEventListener('resize', onResize);

/* =====================================================================
   main loop
   ===================================================================== */
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  for (const fn of updaters) fn(dt, t);
  controls.update(dt);
  POST.render(dt, t);
}
renderer.setAnimationLoop(frame);

window.APP = { POST, THERM, setThermal, setSight, applyPreset, LIGHTING, SCN, SKY, W, RG, THREE, scene, camera, renderer, controls, tank, MAT, G, T, Kit, PARTS, sun, hemi };
</script>
</body>
</html>
